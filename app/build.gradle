apply plugin: 'com.android.application'

android {
    namespace 'com.aistudio.abeesbeladna.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.aistudio.abeesbeladna.app"
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName "4.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
